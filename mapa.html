<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa das Paradas</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
      }

      #map {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      const paradas = [
        { nome: 'UNASP', lat: -22.8773542, lng: -47.2280647 },
        { nome: 'Parada 1', lat: -22.8768, lng: -47.2269 },
        { nome: 'Parada 2', lat: -22.8783, lng: -47.2292 }
      ];

      const map = L.map('map').setView([-22.8773542, -47.2280647], 14);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      paradas.forEach((p) => {
        L.marker([p.lat, p.lng]).addTo(map).bindPopup(p.nome);
      });
    </script>
  </body>
</html>
